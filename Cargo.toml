[package]
name = "Oxycash"
version = "0.8.5"
edition = "2024"

[features]
desktop = []

[[bin]]
name = "Oxycash"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
crate-type = ["cdylib"]
name = "Oxycash_And"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

# --- Desktop (Windows + Linux) ---
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd   = "0.17"
slint = { version = "1.17", features = ["backend-winit", "renderer-femtovg"] }

# --- Android ---
[target.'cfg(target_os = "android")'.dependencies]
slint                    = { version = "1.17", features = ["backend-android-activity-06", "renderer-skia"] }
android-activity         = { version = "0.6.1", features = ["native-activity"] }
webpki-roots             = "1"
rustls                   = { version = "0.23", features = ["aws_lc_rs"] }

# --- Build deps ---
[build-dependencies]
slint-build = "1.17"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[package.metadata.android]
package   = "io.github.promethyxx.oxycash"
resources = "assets/res"

[package.metadata.android.sdk]
min_sdk_version    = 28
target_sdk_version = 36

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Oxycash"
icon  = "@mipmap/ic_launcher"

# --- Release profile ---
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
