[package]
name = "Oxycash"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Oxycash"
path = "src/main.rs"

[lib]
crate-type = ["cdylib"]
name = "oxycash"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }


[target.'cfg(not(target_os = "android"))'.dependencies]
rfd   = "0.17"
slint = { version = "1.15", features = ["backend-winit", "renderer-femtovg"] }


[target.'cfg(target_os = "android")'.dependencies]
slint            = { version = "1.15", features = ["backend-android-activity-06", "renderer-skia"] }
android-activity = { version = "0.6", features = ["native-activity"] }

[build-dependencies]
slint-build = "1.15"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[package.metadata.android]
package            = "io.github.promethyxx.oxycash"
label              = "Oxycash"
icon               = "@mipmap/oxycash_icon"
resources          = "res"
min_sdk_version    = 31
target_sdk_version = 36


# --- Release profile
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
