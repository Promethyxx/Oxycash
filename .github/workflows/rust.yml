name: Oxycash CI/CD
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE26: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: android-cargo-
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android NDK
      run: |
        sdkmanager "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
    - name: Setup keystore
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
        printf '\n[package.metadata.android.signing.release]\npath = "%s/keystore.jks"\n' "$GITHUB_WORKSPACE" >> Cargo.toml
        printf 'keystore_password = "%s"\n' "$STORE_PASSWORD" >> Cargo.toml
    - name: Install cargo-apk
      run: cargo install cargo-apk
    - name: Build APK
      run: cargo apk build --release --lib
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
    - name: Rename APK
      run: |
        echo "=== Contenu de target/ ==="
        find target -name "*.apk" 2>/dev/null || echo "Aucun APK trouvé"
        find target -name "*.apk" -o -name "Oxycash*" 2>/dev/null | head -20
        ls -la target/ || true
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-android
        path: apk_out/Oxycash_And.apk
