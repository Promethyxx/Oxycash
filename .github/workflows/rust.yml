name: Oxycash CI/CD
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Win_x64
            artifact_name: Oxycash_Win_x64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Lin_x64
            artifact_name: Oxycash_Lin_x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Lin_arm64
            artifact_name: Oxycash_Lin_ARM
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.label }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ matrix.label }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ matrix.label }}-cargo-
    - name: Install Linux deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc g++ cmake pkg-config libfontconfig1-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libgl1-mesa-dev libwayland-dev libxkbcommon-dev libssl-dev
    - name: Build
      run: cargo build --release --features="desktop" --target ${{ matrix.target }}
    - name: Prepare binary (Windows)
      if: runner.os == 'Windows'
      run: Copy-Item target/${{ matrix.target }}/release/Oxycash.exe ${{ matrix.artifact_name }}
      shell: pwsh
    - name: Prepare binary (Linux)
      if: runner.os == 'Linux'
      run: |
        cp target/${{ matrix.target }}/release/Oxycash ${{ matrix.artifact_name }}
        chmod +x ${{ matrix.artifact_name }}
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.label }}
        path: ${{ matrix.artifact_name }}

  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: android-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: android-cargo-
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android NDK
      run: |
        sdkmanager "ndk;28.0.13004108"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> $GITHUB_ENV
    - name: Setup keystore
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      run: |
        echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
        printf '\n[package.metadata.android.signing.release]\npath = "%s/keystore.jks"\n' "$GITHUB_WORKSPACE" >> Cargo.toml
        printf 'keystore_password = "%s"\n' "$STORE_PASSWORD" >> Cargo.toml
    - name: Install cargo-apk
      run: cargo install cargo-apk
    - name: Build APK
      run: cargo apk build --release --lib
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
    - name: Rename APK
      run: |
        mkdir -p apk_out
        find target -name "*.apk" -exec cp {} apk_out/Oxycash_And.apk \;
    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-android
        path: apk_out/Oxycash_And.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    name: Release
    steps:
    - uses: actions/checkout@v7
    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        merge-multiple: true
    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Oxycash ${{ steps.version.outputs.version }}
        body: |
          ## Platforms
          | Platform | Oxycash | Name |
          |---|:---:|---|
          | Android | ✅ | Oxycash_And.apk |
          | Linux ARM64 | ✅ | Oxycash_Lin_ARM |
          | Linux x64 | ✅ | Oxycash_Lin_x64 |
          | Windows x64 | ✅ | Oxycash_Win_x64.exe |
        files: |
          Oxycash_Win_x64.exe
          Oxycash_Lin_x64
          Oxycash_Lin_ARM
          Oxycash_And.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}