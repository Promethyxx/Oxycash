[package]
name = "Oxycash"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "Oxycash"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json",] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rfd        = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }


# Slint: one entry per target, no conflict
# Desktop (Linux / Windows / macOS)
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.12", features = ["backend-winit", "renderer-femtovg"] }

# Android - activity 0.5 + Skia renderer
[target.'cfg(target_os = "android")'.dependencies]
slint            = { version = "1.12", features = ["backend-android-activity-05", "renderer-skia"] }
android-activity = { version = "0.5", features = ["native-activity"] }

[build-dependencies]
slint-build = "1.12"

# Android packaging (cargo-apk)
[package.metadata.android]
package            = "io.github.promethyxx.oxycash"
label              = "Oxycash"
min_sdk_version    = 26   # Android 8.0 - required by android-activity 0.5
target_sdk_version = 34

[package.metadata.android.signing.release]
path = "keystore.jks"     # generate once with: keytool -genkey ...
# --- Release profile
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
